name: API-Football backfill

# Daily, within the free plan's 100 requests. Saves each finished match once and commits it,
# so progress carries over between runs. When the season is complete it costs one request.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Most requests this run may spend (free plan: 100 a day)"
        default: "90"

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - name: Download finished matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m src.api_football_ingest "${{ github.event.inputs.budget || '90' }}"
      - name: Commit new matches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/api_football
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Backfill: $(git diff --cached --name-only | grep -c fixtures/) matches, $(git diff --cached --name-only | grep -c players/) player-total pages, $(git diff --cached --name-only | grep -c transfers/) transfer histories"
          git pull --rebase origin main
          git push origin HEAD:main
